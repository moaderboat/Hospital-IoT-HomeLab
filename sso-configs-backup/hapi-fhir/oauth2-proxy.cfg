  # HTTP Settings
  http_address = "0.0.0.0:4180"
  upstreams = ["http://127.0.0.1:8080"]

  # Keycloak Provider Settings
  provider = "keycloak-oidc"
  client_id = "hapi-fhir-oauth2"
  client_secret = "password"
  redirect_url = "http://10.30.0.56:4180/oauth2/callback"

  # Keycloak URLs (hospital-homelab realm)
  oidc_issuer_url = "http://10.30.0.57:8080/realms/hospital-homelab"
  login_url = "http://10.30.0.57:8080/realms/hospital-homelab/protocol/openid-connect/auth"
  redeem_url = "http://10.30.0.57:8080/realms/hospital-homelab/protocol/openid-connect/token"
  validate_url = "http://10.30.0.57:8080/realms/hospital-homelab/protocol/openid-connect/userinfo"

  # PKCE Support
  code_challenge_method = "S256"
  scope = "openid email profile"

  # Cookie Settings - HIPAA Compliant
  cookie_secret = "password"
  cookie_secure = false
  cookie_name = "_oauth2_proxy_hapi"
  cookie_expire = "30m"       # 30 minute absolute timeout
  cookie_refresh = "10m"      # Re-validate every 10 minutes
  cookie_httponly = true
  cookie_samesite = "lax"

  # Email/User Settings
  email_domains = ["*"]
  whitelist_domains = [".10.30.0.56"]

  # Logging
  request_logging = true
  auth_logging = true
  standard_logging = true

  # Session Settings
  session_store_type = "cookie"

  # Security - Show login screen instead of auto-redirecting
  skip_provider_button = false

  # Sign out settings
  reverse_proxy = true
